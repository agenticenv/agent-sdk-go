# GoReleaser config — builds agctl for multiple platforms, creates GitHub Release
# See https://goreleaser.com/customization/

version: 2

project_name: agent-sdk-go

builds:
  # agctl is a separate Go module in ./cli (its go.mod replaces the SDK with ../),
  # so the build runs inside that directory.
  - id: agctl
    dir: ./cli
    main: .
    binary: agctl
    ldflags:
      - -s -w
      - -X=main.version={{.Tag}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: agctl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  header: |
    ## Agent SDK for Go

    ### Install the SDK (library)

    ```bash
    go get github.com/agenticenv/agent-sdk-go@{{ .Tag }}
    ```

    ### Install agctl (CLI)

    Download the archive for your platform from the **Assets** below (Linux, macOS, Windows — amd64 and arm64). Then extract and add to your `PATH`.

    ---
  footer: |
    **Full Changelog**: https://github.com/agenticenv/agent-sdk-go/compare/{{ if .PreviousTag }}{{ .PreviousTag }}...{{ end }}{{ .Tag }}

changelog:
  use: github
  sort: asc
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Documentation"
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Tests"
      regexp: '^.*?test(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "CI/CD"
      regexp: '^.*?ci(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Maintenance"
      regexp: '^.*?chore(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: "Other"
      order: 999
