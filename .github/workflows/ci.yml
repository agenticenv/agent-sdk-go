# CI: lint, test, coverage, build
# - PR to main: full checks + Codecov upload
# - workflow_dispatch: same + Codecov upload (on-demand coverage report)
# - Push / merge to main: no workflow (already validated on the PR)
# (Secret scanning: run `task secrets-scan` locally.)
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # v2 is built with Go >= 1.26; v1.x binaries refuse modules targeting go 1.26+
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Code coverage
        run: task test-coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: agenticenv/agent-sdk-go
          files: ./coverage.out

      - name: Build
        run: task build

  # agctl CLI is its own module (cmd/go.mod). Runs the same lint/test/build gates
  # that used to be covered when cmd was part of the SDK module.
  agctl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/go.mod
          cache-dependency-path: cmd/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Check (lint + test + build)
        working-directory: cmd
        run: task check

  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PromptFoo
        working-directory: eval-harness/promptfoo
        run: npx --yes promptfoo@latest eval -c config.yaml

      - name: DeepEval
        working-directory: eval-harness/deepeval
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pytest test_agent.py -v

  # examples:local — off until if: true and EXAMPLES_* repo secrets (examples/.env.defaults).
  examples:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Configure examples/.env
        run: |
          cat > examples/.env <<EOF
          LLM_PROVIDER=${{ secrets.EXAMPLES_LLM_PROVIDER }}
          LLM_MODEL=${{ secrets.EXAMPLES_LLM_MODEL }}
          LLM_APIKEY=${{ secrets.EXAMPLES_LLM_APIKEY }}
          EMBEDDING_OPENAI_APIKEY=${{ secrets.EXAMPLES_EMBEDDING_OPENAI_APIKEY }}
          EOF

      - name: Run examples (local)
        run: task examples:local
