# Release: security gates then GoReleaser builds agctl and creates GitHub Release
# Trigger: push a tag (v0.0.1, v1.0.0, etc.) via scripts/release.sh or manual tag
# Hard fail: gitleaks / govulncheck failure stops the job — GoReleaser does not run.
# Fix on main, then push a new tag. See RELEASING.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --- Security gates (hard fail; no continue-on-error) ---

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (SDK)
        run: govulncheck ./...

      - name: govulncheck (agctl)
        working-directory: cli
        run: govulncheck ./...

      # --- Ship only if gates passed ---

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
